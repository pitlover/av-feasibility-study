# Stage1: Cosmos3-Edge -> KITTI + Waymo (camera-relative raw 9D)
# Commands: bash stage1_full_train_eval.sh --toml configs/stage1_full.toml plan|train|export|evaluate
[job]
run_step = "all"   # config | inspect | plan | train | export | evaluate | all
run_tag = "s1_pipeline_v1"               # New unique run; do not overwrite past training
eval_tag = "val_seed42_v1"

[paths]
run_root = "runs_stage1_full"
exports_root = "exports"
evaluation_root = "evaluation"
base = "."
processed = "processed_virtual_native_v2"
framework = "cosmos-framework"
# Explicit paths avoid depending on a historical template run.json.
edge_dcp = "/mnt/ufs/users/jiyoung-kim/project/backend/cosmos/cookbooks/cosmos3/generator/action/finetune/checkpoints/Cosmos3-Edge"
wan_vae = "/mnt/ufs/users/jiyoung-kim/project/backend/cosmos/cookbooks/cosmos3/generator/action/finetune/checkpoints/wan22_vae/Wan2.2_VAE.pth"

[data]
epoch_clips = 12000
seed = 42

[data.weights]
kitti = 1.0
waymo = 1.0

[train]
gpus = 4
max_iters = 3000
save_every = 500

[optimizer]
lr = 1e-5

[wandb]
enabled = false
mode = "disabled"                     # disabled | offline | online
project = "cosmos3_av_id"

[export]
step = 0                              # 0 -> train.max_iters

[eval]
mode = "full"                         # full (infer+score+render) | score | render | both
clips_per_dataset = 20
infer_gpus = 1
# Leave empty to use the run's default evaluation and prediction folders.
eval_dir = ""
pred_dir = ""
render_enabled = true                # used only when eval.mode="full"
render_max_clips = 3                 # per dataset (KITTI 3 + Waymo 3)
render_clip_ids = []                 # or ["kitti_10_000000", ...]
ground_height_m = 1.7                # visual-only approximation, NOT used in metrics
horizon_steps = 60
fps = 10
layout = "both"
